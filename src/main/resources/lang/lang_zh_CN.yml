# 中文语言配置文件

command:
  common:
    usage_invalid: "§c用法不正确，请检查命令格式。"
    invalid_number: "§c无效的数字格式。"
    invalid_identifier: "§c无效的标识符，必须是 'id' 或 'cdk'。"
    not_found: "§cCDK不存在。"
    no_permission: "§c您没有权限执行此命令。"
    no_permission_log: "§c你没有权限执行此命令。需要权限: cdk.log"
    player_only: "§c该命令只能由玩家执行。"
    unknown_command: "未知命令，使用/cdk help查看帮助。"

  create:
    usage: |
      §c用法: /cdk create <数量> "<命令1|命令2|...>" [次数] [备注] [过期时间] [类型] [允许多次使用]
      §7  - 数量: 要生成的CDK个数 (1-100)
      §7  - 命令: 被双引号包裹的命令序列，多个命令用 '|' 分隔
      §7  - 次数: 每个CDK可兑换次数，默认取配置文件值
      §7  - 备注: 可选文本说明，支持空格（建议用引号包裹）
      §7  - 过期时间: 格式如 '2025-12-31 23:59' 或 'forever'
      §7  - 类型: 可选分类标签
      §7  - 允许多次使用: true/false，是否允许同一玩家多次使用同一个CDK
    amount_range: "§c数量必须在1-100之间。"
    need_quotes: "§c命令部分必须用英文双引号包裹。"
    command_empty: "§c命令不能为空。"
    invalid_uses: "§c无效的兑换次数格式。"
    success_single: "§a成功创建CDK码: §f{0}"
    success_multi: "§a成功创建 {0} 个CDK码。类型: {1}\n§f{2}"
    error: "§c创建CDK时出错: {0}"

  use:
    usage: "§c用法: /cdk use <兑换码>"
    invalid_code: "§c无效的兑换码。"
    expired_or_used: "§c该兑换码已过期或无剩余次数。"
    already_used: "§c您已经使用过该兑换码。"
    success: "§a兑换成功！"
    use_error: "§c执行兑换码命令时出错，请联系管理员。"
    error: "§c使用兑换码时出错: {0}"

  add:
    usage: "§c用法: /cdk add <id/cdk> <标识符> <数量>"
    amount_positive: "§c增加的数量必须大于0。"
    success: "§a已为CDK码 {0} 增加 {1} 次使用次数。当前剩余: {2}"
    error: "§c增加CDK使用次数时出错: {0}"

  del:
    usage: "§c用法: /cdk del <id/cdk> <标识符>"
    success: "§a成功删除CDK码: {0}"
    error: "§c删除CDK时出错: {0}"

  list:
    usage: "§c用法: /cdk list [页码] [类型] 或 /cdk list [类型] [页码]"
    empty: "§c暂无CDK记录。"
    header: "§6=== CDK列表 ==="
    page_info: "§7页码: §f{0}/{1} §7(总计: §f{2}§7)"
    type_filter: "§7类型过滤: §f{0}"
    item: "§f{0}. {1} §7({2}次) [{3}] §8[{4}] §7备注: §f{5}"
    footer: "§6================"
    error: "§c获取CDK列表时出错: {0}"

  log:
    usage: "§c用法: /cdk log [页码] | /cdk log view <id> | /cdk log filter <player|uuid|type> <值> [页码]"
    empty: "§c暂无兑换记录。"
    header: "§6=== CDK兑换记录 - 第{0}页 ==="
    hint: "§7提示: 鼠标悬停玩家名或CDK可显示UUID；悬停命令数或时间可查看命令列表；使用 /cdk log view <id> 查看单条详情。"
    page_info: "§7页码: §f{0}/{1} §7(总计: §f{2}§7)"
    page_hint: "§7使用 /cdk log <页码> 翻页，或 /cdk log view <id> 查看详情。"
    unknown_filter: "§c未知的过滤字段: {0}"
    view_not_found: "§c未找到指定 ID 的记录。"
    view_usage: "§c用法: /cdk log view <id>"
    read_error: "§c读取日志失败: {0}"
    error: "§c获取兑换记录时出错: {0}"

  query:
    usage: "§c用法: /cdk query <id/cdk> <标识符>"
    header: "§6=== CDK详细信息 ==="
    footer: "§6=================="
    error: "§c查询CDK信息时出错: {0}"

  set:
    usage: "§c用法: /cdk set <id/cdk> <标识符> <属性> <值>"
    invalid_property: "§c无效的属性类型。"
    success: "§a成功更新CDK码: §f{0}"
    error: "§c设置CDK属性时出错: {0}"

  view:
    usage: "§c用法: /cdk view <id/cdk> <标识符>"
    not_found: "§c未找到记录。"
    header: "§6=== CDK兑换记录 详情 (ID: {0}) ==="
    error: "§c读取日志时出错: {0}"

  reload:
    usage: "§c用法: /cdk reload"
    success: "§a配置已重新加载。"
    error: "§c重新加载配置时出错: {0}"

  export:
    usage: "§c用法: /cdk export [yml文件]"
    success: "§a成功导出到 {0}"
    error: "§c导出失败: {0}"

  import:
    usage: "§c用法: /cdk import <文件> [replace|append]"
    success: "§a成功从 {0} 导入CDK。"
    error: "§c导入失败: {0}"

  help:
    header: "§6=== CDK 帮助 ==="
    create: "§f/cdk create <数量> \"<命令1|命令2|...>\" [次数] [备注] [过期时间] [类型] [允许多次使用] §7- 创建CDK"
    create_params: |
      §7参数说明:
      §7<数量>: 生成CDK数量 (1-100)
      §7<命令>: 玩家兑换时执行的命令，多个用|分隔
      §7[次数]: 每个CDK可被兑换的总次数，默认1
      §7[备注]: 该CDK的备注信息
      §7[过期时间]: 过期时间，格式yyyy-MM-dd HH:mm
      §7[类型]: 自定义类型标识
      §7[允许多次使用]: true/false，是否允许同一玩家多次兑换
      §7示例: /cdk create 5 "give %player% diamond 1|say 恭喜获得钻石" 1 "新手礼包" 2025-12-01 10:00 vip true
    use: "§f/cdk use <兑换码> §7- 使用CDK"
    use_example: "  §7示例: /cdk use ABC123XYZ789"
    add: "§f/cdk add <id/cdk> <标识符> <数量> §7- 增加使用次数"
    add_example: "  §7示例: /cdk add id 1 5 或 /cdk add cdk ABC123XYZ789 3"
    del: "§f/cdk del <id/cdk> <标识符> §7- 删除CDK"
    del_example: "  §7示例: /cdk del id 1 或 /cdk del cdk ABC123XYZ789"
    list: "§f/cdk list [页码] [类型] §7- 列出所有CDK，支持分页和类型筛选"
    list_example: "  §7示例: /cdk list 2 或 /cdk list vip 或 /cdk list vip 2"
    log: "§f/cdk log [页码] §7- 列出玩家兑换记录，支持分页。需要权限: cdk.log"
    log_example: "  §7示例: /cdk log 或 /cdk log 2 或 /cdk log filter player Steve"
    log_hint: "  §7提示: 玩家上悬停显示 UUID；悬停命令数可查看命令列表；使用 /cdk log view <id> 查看单条详情。 "
    query: "§f/cdk query <id/cdk> <标识符> §7- 查询CDK信息"
    query_example: "  §7示例: /cdk query id 1 或 /cdk query cdk ABC123XYZ789"
    view: "§f/cdk view <id/cdk> <标识符> §7- 在控制台或非玩家环境中查看CDK详情（纯文本，不带 hover）"
    view_example: "  §7示例: /cdk view id 1 或 /cdk view cdk ABC123XYZ789"
    set: "§f/cdk set <id/cdk> <标识符> <属性> <值> §7- 设置CDK属性"
    set_props: "  §7可设置的属性: remaining_uses, commands, expire_time, note, cdk_type, per_player_multiple"
    set_examples: |
      §7示例: /cdk set id 1 remaining_uses 10
      §7示例: /cdk set cdk ABC123XYZ789 commands "give {player} diamond 5|say 获得钻石"
      §7示例: /cdk set id 1 expire_time "2025-12-31 23:59"
      §7示例: /cdk set cdk ABC123XYZ789 note "更新备注"
      §7示例: /cdk set id 1 cdk_type "vip"
      §7示例: /cdk set cdk ABC123XYZ789 per_player_multiple true
    reload: "§f/cdk reload §7- 重新加载配置"
    import: "§f/cdk import <文件> [replace|append] §7- 从yml导入CDK"
    import_examples: |
      §7replace: 替换现有所有CDK，append: 追加到现有CDK
      §7示例: /cdk import cdks.yml replace
    export: "§f/cdk export <文件> §7- 导出CDK到yml"
    export_example: "  §7示例: /cdk export cdks.yml"
    footer: "§6=============="
